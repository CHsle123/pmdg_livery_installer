name: Update version.json

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-version-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update version.json with jq
        run: |
          # 如果 version.json 不存在，先创建默认内容
          if [ ! -f version.json ]; then
            echo '{"version": "", "download_url": "", "release_notes": ""}' > version.json
          fi
          # 获取 Release 标签名（版本号）和下载链接
          TAG_NAME="${{ github.event.release.tag_name }}"
          # 去除可能的 'v' 前缀
          VERSION="${TAG_NAME#v}"
          # 获取第一个 assets 的下载链接（如果有）
          # 注意：这里需要根据你的实际资产名称调整，也可直接使用固定模板
          # 方法1：使用 release 的 zipball_url 作为备选
          DOWNLOAD_URL="${{ github.event.release.zipball_url }}"
          # 方法2：如果有 .exe 附件，可以用下面的逻辑获取（但需要 GitHub API，不推荐）
          # 我们直接使用固定的下载链接模板（假设附件名为 pmdg_livery_installer_setup.exe）
          # 更稳妥：从 release 的 assets 中获取（需要 API，但我们可以用 github.event.release.assets）
          # 但 github.event.release.assets 在推送事件中可能不完全，所以这里用简单方式：
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/pmdg_livery_installer_setup.exe"
          # 获取 Release 描述
          RELEASE_NOTES="${{ github.event.release.body }}"
          # 用 jq 更新 JSON
          jq --arg version "$VERSION" \
             --arg download_url "$DOWNLOAD_URL" \
             --arg release_notes "$RELEASE_NOTES" \
             '.version = $version | .download_url = $download_url | .release_notes = $release_notes' \
             version.json > tmp.json && mv tmp.json version.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version.json to ${{ github.event.release.tag_name }}" || echo "No changes to commit"
          git push
