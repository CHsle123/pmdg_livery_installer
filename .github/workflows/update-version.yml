name: Update version.json

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update version.json
        run: |
          # 确保在 main 分支上
          git checkout main || git checkout -b main
          
          # 获取 Release 信息
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION="${TAG_NAME#v}"
          RELEASE_BODY="${{ github.event.release.body || '' }}"
          REPO="${{ github.repository }}"
          ASSET_NAME="pmdg_livery_installer_latest_setup.exe"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${ASSET_NAME}"
          
          if [ ! -f version.json ]; then
            echo '{"version": "", "download_url": "", "release_notes": ""}' > version.json
          fi
          
          jq --arg version "$VERSION" \
             --arg download_url "$DOWNLOAD_URL" \
             --arg release_notes "$RELEASE_BODY" \
             '.version = $version | .download_url = $download_url | .release_notes = $release_notes' \
             version.json > tmp.json && mv tmp.json version.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: update version.json to ${{ github.event.release.tag_name }}" || echo "No changes to commit"
          git push origin main
